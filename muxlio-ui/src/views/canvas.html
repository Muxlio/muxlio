<template data-view="shell">
<div class="canvas-view-container">
  <div id="canvasToolbarSlot">{{value0}}</div>
  <div class="canvas-view-body">
    <main class="canvas-main-area" id="canvasMainArea">
      <div id="canvasRoot" class="canvas-root">{{value2}}</div>
      <div id="canvasSourceView" class="canvas-source-view" hidden>{{value3}}</div>
    </main>
    <aside class="canvas-inspector-rail" id="canvasInspectorSlot" aria-label="Canvas information" hidden>
      <div class="canvas-info-head"><div><h2>Canvas info</h2><p>Display options and output files</p></div><button type="button" class="btn ghost canvas-info-close" id="canvasCloseInfoBtn" aria-label="Close canvas information">×</button></div>
      {{value4}}
    </aside>
  </div>
</div>
</template>

<template data-view="toolbar">
<div class="canvas-toolbar">
  <div class="canvas-toolbar-info">
    <div class="canvas-toolbar-title-row">
      <h1 class="canvas-doc-title">{{value0}}</h1>
    </div>
    <p class="canvas-doc-desc">{{value1}}</p>
  </div>
  <div class="canvas-toolbar-actions">
    <button type="button" class="btn" id="canvasCopyLinkBtn">Copy link</button>
    <button type="button" class="btn" id="canvasDownloadBtn">Download</button>
    <button type="button" class="btn" id="canvasPinBtn">Pin</button>
    <button type="button" class="btn" id="canvasToggleProvenanceBtn" aria-controls="canvasInspectorSlot" aria-expanded="false">Info</button>
  </div>
</div>
</template>

<template data-view="rail-nav">
<div class="canvas-rail-inner">
  <h3 class="canvas-info-label">Files</h3>
  <div class="canvas-rail-list">{{value0}}</div>
</div>
</template>

<template data-view="rail-file">
<a class="canvas-rail-link{{value0}}" href="{{value1}}"><svg class="canvas-rail-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11.5 2.5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M11 2.5V7h5M7 11h6M7 14h4"/></svg><span class="canvas-rail-name">{{value2}}</span><span class="canvas-file-arrow" aria-hidden="true">↗</span></a>
</template>

<template data-view="provenance-panel">
<div class="canvas-provenance">
  <section class="canvas-info-section" aria-labelledby="canvasDisplayLabel">
    <h3 class="canvas-info-label" id="canvasDisplayLabel">Display</h3>
    <div class="canvas-display-switch" role="tablist" aria-labelledby="canvasDisplayLabel">
      <button type="button" class="canvas-display-option {{value2}}" id="canvasModePreview" role="tab" aria-controls="canvasRoot" aria-selected="{{value3}}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="2"/><path d="M2.5 7h15M8 7v10.5"/></svg>{{value7}}</button>
      <button type="button" class="canvas-display-option {{value4}}" id="canvasModeSource" role="tab" aria-controls="canvasSourceView" aria-selected="{{value5}}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 5-4 5 4 5m8-10 4 5-4 5m-3-12-2 14"/></svg>{{value8}}</button>
    </div>
  </section>
  <section class="canvas-info-section" id="canvasRailSlot">{{value6}}</section>
  <section class="canvas-info-section">
      <label class="canvas-info-label" for="canvasRevisionSelect">Revision</label>
      <select class="control" id="canvasRevisionSelect">{{value1}}</select>
  </section>
  <details class="canvas-info-technical">
    <summary>Technical details</summary>
    <dl class="canvas-prov-rows">{{value0}}</dl>
  </details>
</div>
</template>

<template data-view="fallback-card">
<div class="canvas-fallback panel">
  <div class="panel-head"><h2 class="canvas-fallback-title">{{value0}}</h2></div>
  <div class="panel-body">
    <p class="canvas-fallback-msg">{{value1}}</p>
    <div class="canvas-fallback-actions">{{value2}}</div>
  </div>
</div>
</template>

<template data-view="pdf-bar">
<text x="0" y="{{value0}}" font-size="10" fill="#263547">{{value1}}</text><rect x="130" y="{{value2}}" width="260" height="14" rx="3" fill="#e7eef0"/><rect x="130" y="{{value2}}" width="{{value3}}" height="14" rx="3" fill="#18756e"/><text x="405" y="{{value0}}" font-size="10" fill="#263547">{{value4}}</text>
</template>

<template data-view="pdf-chart">
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="{{value0}}">{{value1}}</svg>
</template>
