<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Canvas · Muxlio</title>
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="stylesheet" href="/dist/app.css" />
    <script defer src="/dist/canvas.js"></script>
  </head>
  <body class="canvas-page">
    <a class="skip-link" href="#mainContent">Skip to content</a>
    <div class="shell">
      {{workspaceNavigation}}
      <header class="top">
        <button
          type="button"
          class="btn ghost menu-toggle"
          id="menuToggle"
          aria-controls="workspaceNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          ☰
          <span>Menu</span>
        </button>
        <div class="crumb">
          <span>workspace</span>
          <span class="crumb-sep" aria-hidden="true">/</span>
          <strong id="topContext">Canvas</strong>
        </div>
        <a id="canvasRunLink" class="btn ghost" href="/runs">← Back to run</a>
      </header>
      <main class="content" id="mainContent" tabindex="-1">
        <div id="message" role="status" aria-live="polite"></div>
        <section id="canvasView" aria-label="Canvas output"></section>
      </main>
    </div>
    <noscript>Enable JavaScript to view this canvas.</noscript>
  </body>
</html>
