name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "muxlio-docs/**"
      - "examples/acp.*"
      - "examples/a2a.*"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/requirements-docs.txt"
  pull_request:
    branches: ["main"]
    paths:
      - "muxlio-docs/**"
      - "examples/acp.*"
      - "examples/a2a.*"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/requirements-docs.txt"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only; elevated permissions are scoped to specific jobs.
permissions:
  contents: read

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets mkdocs-git-revision-date-localized work if added later.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install MkDocs + Material
        run: pip install -r .github/requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload PR preview artifact
        # Provides downloadable preview artifact for PR reviews without deploying.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-preview
          path: site/
          retention-days: 7

      - name: Upload Pages artifact
        # Only upload on pushes to main; PRs just validate and create a preview artifact.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Least-privilege: id-token: write is strictly isolated to the deployment job.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Required by actions/deploy-pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
