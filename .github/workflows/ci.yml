name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── TypeScript / Node ─────────────────────────────────────────────────────
  node:
    name: Node ${{ matrix.node }} – build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm run test

      - name: Test UI (standalone)
        working-directory: muxlio-ui
        run: npm test

  # ── Go – adapters ─────────────────────────────────────────────────────────
  go-adapters:
    name: Go ${{ matrix.go }} – adapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: muxlio-core/go.sum

      - name: Test adapters
        working-directory: muxlio-adapters
        run: go test ./...

  # ── Go – core ─────────────────────────────────────────────────────────────
  go-core:
    name: Go ${{ matrix.go }} – core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: muxlio-core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Expose node_modules binaries to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Test core
        working-directory: muxlio-core
        run: go test ./...

  # Installed-product fixtures deliberately run separately from unit tests.
  installed-clients:
    name: Installed ${{ matrix.profile }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [claude-2.1.319, codex-0.167.0, cursor-2.4.0, cursor-2.3.0, kiro-2.37.0, antigravity-unavailable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: muxlio-core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build installed product
        run: bash scripts/build-release.sh "$RUNNER_TEMP/muxlio-release"
      - name: Installed-prefix smoke test
        if: matrix.profile == 'codex-0.167.0'
        run: bash scripts/verify-install.sh "$RUNNER_TEMP/muxlio-release"
      - name: Pinned client configuration/protocol fixtures
        env:
          MUXLIO_ACCEPTANCE_PREFIX: ${{ runner.temp }}/muxlio-release
          MUXLIO_ACCEPTANCE_PROFILE: ${{ matrix.profile }}
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/installed.xml"
          muxlio-testing/acceptance/installed.test.mjs
      - name: Installed-client results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.os }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/installed.xml
          if-no-files-found: ignore
