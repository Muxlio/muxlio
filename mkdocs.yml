site_name: Muxlio
site_description: >-
  A durable workflow execution engine that coordinates AI agents and tools
  through compiled, content-addressed plans.
site_url: https://muxlio.github.io/muxlio/
repo_url: https://github.com/Muxlio/muxlio
repo_name: Muxlio/muxlio
edit_uri: edit/main/muxlio-docs/

docs_dir: muxlio-docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: teal
      accent: teal
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Choosing an adapter: adapters.md
  - Service Guide: service.md
  - MCP Integration: mcp.md
  - Workflow templates: workflow-templates.md
  - Observability UI: ui-operations.md
  - Accounting: accounting.md
  - Benchmarks: benchmarks.md
  - Architecture:
      - Overview: architecture/overview.md
      - Durable Execution: architecture/durable-execution.md
      - Worker Protocol: architecture/worker-protocol.md
      - Artifact Storage: architecture/artifact-storage.md
      - Environment Manifests: architecture/environment-manifests.md
      - Execution Security: architecture/execution-security.md
      - CLI and SDK Reference: architecture/developer-reference.md
      - Service Reference: architecture/service-reference.md
      - MCP Reference: architecture/mcp-reference.md
      - Operations Reference: architecture/operations-reference.md
      - Benchmark Methodology: architecture/benchmark-methodology.md
  - Error Reference: errors/errors.md
